<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Amali Curtain Center</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="View our portfolio of beautifully tailored curtains, blinds, and drapes installed in homes across Horana.">
  <meta property="og:title" content="Gallery - Amali Curtain Center">
  <meta property="og:description" content="View our portfolio of beautifully tailored curtains, blinds, and drapes installed in homes across Horana.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/logos/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Gallery page only ---- */
    .page-hero {
      padding: 3.5rem 0 2rem;
      text-align: center;
    }

    .page-hero h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: 1rem;
    }

    .page-hero p {
      max-width: 38rem;
      margin: 0 auto;
      color: var(--ink-soft);
    }

    .gallery-masonry {
      column-count: 1;
      column-gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .gallery-masonry {
        column-count: 2;
      }
    }

    @media (min-width: 900px) {
      .gallery-masonry {
        column-count: 3;
      }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      cursor: default;
    }

    .gallery-item.has-image {
      cursor: zoom-in;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item.has-image:hover img {
      transform: scale(1.04);
    }

    .gallery-item .gallery-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      min-height: 180px;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .gallery-note {
      font-size: 0.75rem;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--ink-soft);
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 15, 10, 0.95); /* Dark warm overlay */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #lightbox.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-content-wrapper {
      position: relative;
      max-width: 1000px;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 8rem); /* Leave room for padding & counter */
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }

    #lightbox img {
      max-width: 100%;
      max-height: 100%;
      min-height: 0; /* Allow image to shrink in flex container */
      object-fit: contain;
      border-radius: 0.75rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .lightbox-meta {
      background: var(--cream-3);
      border-radius: 0.75rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      flex-shrink: 0; /* Prevent the text box from squishing */
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: left;
    }

    .lightbox-meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      gap: 1rem;
    }

    #lightbox-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--ink);
      margin: 0;
      line-height: 1.2;
    }

    .location-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--cream-4);
      color: var(--ink);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .location-tag svg {
      width: 12px;
      height: 12px;
    }

    #lightbox-desc {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.6;
      margin: 0;
    }

    #lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--stone-50);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 201;
    }
    
    #lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--stone-50);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 201;
      cursor: pointer;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-50%) scale(1.05);
    }

    .lightbox-prev {
      left: 1.5rem;
    }

    .lightbox-next {
      right: 1.5rem;
    }

    #lightbox-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
      .lightbox-nav {
        width: 40px;
        height: 40px;
      }
      .lightbox-prev { left: 0.5rem; }
      .lightbox-next { right: 0.5rem; }
      
      .lightbox-meta {
        padding: 1.25rem;
      }
      #lightbox-title { font-size: 1.25rem; }
    }
  </style>
</head>

<body class="antialiased">

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Amali Curtain Center home">

      </a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html">Home</a>

      <div class="header-actions">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4C7.63 4 4.05 7.58 4.05 12c0 1.4.37 2.77 1.06 3.98L4 20l4.14-1.09a7.94 7.94 0 0 0 3.9 1.02h.01c4.42 0 8-3.58 8-8 0-2.14-.83-4.15-2.35-5.61zM12.05 18.4h-.01a6.4 6.4 0 0 1-3.26-.9l-.23-.14-2.42.64.65-2.36-.15-.24a6.42 6.42 0 0 1-.99-3.4c0-3.55 2.9-6.45 6.46-6.45 1.72 0 3.34.67 4.56 1.89a6.41 6.41 0 0 1 1.89 4.57c0 3.55-2.9 6.45-6.5 6.45z"
              fill="var(--ink)" />
          </svg>
        </a>
        <a href="tel:+94774104159" aria-label="Call us" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4.5c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"
              fill="var(--ink)" />
          </svg>
        </a>
        <a href="contact.html" class="btn btn-primary">Request a Consultation</a>
      </div>
      <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="mobile-nav"
        aria-label="Toggle menu">
        <span class="hamburger-line line-1"></span>
        <span class="hamburger-line line-2"></span>
        <span class="hamburger-line line-3"></span>
      </button>
    </div>
    <div id="mobile-nav" class="mobile-nav">
      <nav class="mobile-nav-inner" aria-label="Mobile">
        <a href="index.html">Home</a>
        <a href="about.html">Our Story</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="https://wa.me/94774104159">Chat on WhatsApp</a>
        <a href="contact.html" class="btn btn-primary">Request a Consultation</a>
      </nav>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <section class="page-hero container">
    <p class="eyebrow">Our Work</p>
    <h1 class="font-display">The Full Gallery</h1>
    <p>A closer look at curtains measured, tailored, and installed by hand across homes in and around Horana.</p>
  </section>

  <!-- GALLERY GRID -->
  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="gallery-masonry reveal" id="full-gallery"></div>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    
    <button id="lightbox-prev" aria-label="Previous photo" class="lightbox-nav lightbox-prev">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    
    <button id="lightbox-next" aria-label="Next photo" class="lightbox-nav lightbox-next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    
    <div class="lightbox-content-wrapper">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-meta">
        <div class="lightbox-meta-header">
          <h3 id="lightbox-title"></h3>
          <span class="location-tag" id="lightbox-location">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21c-4.418-4.418-7-8.918-7-12a7 7 0 1114 0c0 3.082-2.582 7.582-7 12zm0-9a3 3 0 100-6 3 3 0 000 6z" fill="currentColor"/>
            </svg>
            <span class="location-text"></span>
          </span>
        </div>
        <p id="lightbox-desc"></p>
      </div>
    </div>
    
    <div id="lightbox-counter"></div>
  </div>

  <script src="js/nav.js"></script>
